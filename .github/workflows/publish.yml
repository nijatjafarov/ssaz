name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install build twine

      - run: python -m build

      - run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
